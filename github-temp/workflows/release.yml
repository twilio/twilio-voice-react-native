name: Release

# Fired by a human publishing a GitHub Release (see prepare-release.yml) -
# the Release's tag is what gets published here, targeting a commit that has
# already been through a reviewed, merged PR.
#
# No job in this file installs dependencies, so no third-party code can run
# alongside the npm-publish credential.
on:
  release:
    types: [published]

# No default permissions; each job below declares exactly what it needs.
permissions: {}

jobs:
  deploy:
    name: Publish to npm
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    environment: production # manual-approval gate + scoped to publish
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      # No install or build step - the tagged commit already has everything
      # built.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 24 # npm >= 11.5.1 (bundled with Node 24) required for OIDC trusted publishing

      - name: Validate tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="$(jq -r '.version' package.json)"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG != package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Read version and release-candidate status
        run: |
          VERSION="$(jq -r '.version' package.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          IS_RELEASE_CANDIDATE=$(node ./scripts/classify-version-tag.js getIsReleaseCandidate "$VERSION")
          echo "IS_RELEASE_CANDIDATE=$IS_RELEASE_CANDIDATE" >> "$GITHUB_ENV"

      - name: Publish to npm
        if: env.IS_RELEASE_CANDIDATE == 'false'
        run: |
          RELEASE_TAG=$(node ./scripts/classify-version-tag.js getNpmDistTag "$VERSION")

          npm publish --registry https://registry.npmjs.org \
            --tag "$RELEASE_TAG" \
            --ignore-scripts --provenance --access public

      - name: Skip publish for release candidate
        if: env.IS_RELEASE_CANDIDATE == 'true'
        run: echo "::notice::${VERSION} is a release candidate - not publishing to npm."

  # This job is separate from the deploy job so that the deploy job doesn't also
  # need push access. No approval gate necessary here - deploy already required
  # one.
  move-latest-tag:
    needs: [deploy]
    runs-on: ubuntu-x64
    if: needs.deploy.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "22.13"

      - name: Decide whether to move the latest git tag
        run: |
          VERSION="$(jq -r '.version' package.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          MOVE_LATEST_GIT_TAG=false

          IS_RELEASE_CANDIDATE=$(node ./scripts/classify-version-tag.js getIsReleaseCandidate "$VERSION")

          if [ "$IS_RELEASE_CANDIDATE" = 'false' ]; then
            RELEASE_TAG=$(node ./scripts/classify-version-tag.js getNpmDistTag "$VERSION")

            if [ "$RELEASE_TAG" = 'latest' ]; then
              MOVE_LATEST_GIT_TAG=true
            fi
          fi

          echo "MOVE_LATEST_GIT_TAG=$MOVE_LATEST_GIT_TAG" >> "$GITHUB_ENV"

      - name: Move the latest git tag
        if: env.MOVE_LATEST_GIT_TAG == 'true'
        run: |
          git tag -f latest "$VERSION"
          git push origin latest --force

      - name: Skip moving latest git tag
        if: env.MOVE_LATEST_GIT_TAG == 'false'
        run: echo "::notice::${VERSION} is not latest - not moving latest git tag."
