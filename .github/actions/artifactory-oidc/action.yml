name: 'Artifactory OIDC Auth'
description: 'Exchange GitHub OIDC token for Artifactory access token and configure npm'

inputs:
  artifactory_url:
    description: 'Base URL of the artifactory instance'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Exchange OIDC token for Artifactory access token
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ inputs.artifactory_url }}
      run: |
        set -euo pipefail

        # jq is used throughout; fail early with a clear message if it's absent
        # (present on ubuntu-latest today, but not guaranteed on every runner).
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required by the artifactory-oidc action but was not found on the runner."
          exit 1
        fi

        # Normalize the base URL: strip any trailing slashes so REGISTRY and the
        # //host/... auth line never end up with double slashes.
        BASE_URL=$(echo "${ARTIFACTORY_URL}" | sed -E 's#/+$##')
        if [ -z "$BASE_URL" ]; then
          echo "::error::ARTIFACTORY_URL is empty."
          exit 1
        fi
        # HOST is scheme-stripped and path-stripped (everything before the first /).
        HOST=$(echo "${BASE_URL}" | sed -E 's#^https?://##; s#/.*$##')

        # 1. Request a GitHub OIDC JWT with Artifactory as the audience.
        #    -G puts --data-urlencode into the query string rather than a POST
        #    body. Encoding the audience instead of splicing it into the URL
        #    keeps the request well-formed whatever the value contains, and
        #    strict validators are happier for it.
        GITHUB_JWT=$(curl -sS -G \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          --data-urlencode "audience=${BASE_URL}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
          | jq -r '.value')
        if [ -z "$GITHUB_JWT" ] || [ "$GITHUB_JWT" = 'null' ]; then
          echo "::error::Failed to obtain GitHub OIDC JWT"
          exit 1
        fi
        echo "::add-mask::$GITHUB_JWT"

        # 2. Exchange it for an Artifactory access token. The body MUST be JSON
        #    and MUST include provider_name, or JFrog issues no token.
        #
        #    Built with jq rather than by splicing the token into a JSON literal,
        #    so it is escaped as a JSON value. A token containing a quote or a
        #    backslash would otherwise break the body or inject sibling fields.
        #    Only the token needs --arg; the rest are constants in this source.
        EXCHANGE_BODY=$(jq -nc --arg subjectToken "$GITHUB_JWT" \
          '{
            grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
            subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
            subject_token: $subjectToken,
            provider_name: "github-actions"
          }')

        RESP=$(curl -sS "${BASE_URL}/access/api/v1/oidc/token" \
          -H 'Content-Type: application/json' \
          -d "$EXCHANGE_BODY")
        ART_TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')

        if [ -z "$ART_TOKEN" ]; then
          echo "::error::OIDC token exchange failed. Redacted response below:"
          # Redact every key whose name contains "token" (access_token,
          # refresh_token, id_token, ...). Withhold entirely if not valid JSON —
          # never print a raw, unredacted body.
          echo "$RESP" | jq 'walk(if type == "object" then with_entries(if (.key | test("token"; "i")) then .value = "<redacted>" else . end) else . end)' 2>/dev/null \
            || echo "::error::(response withheld — not valid JSON)"
          exit 1
        fi
        echo "::add-mask::$ART_TOKEN"

        # 3. Point npm at the curated Artifactory registry for this job.
        REGISTRY="${BASE_URL}/artifactory/api/npm/virtual-npm-thirdparty/"
        {
          echo "registry=${REGISTRY}"
          echo "//${HOST}/artifactory/api/npm/virtual-npm-thirdparty/:_authToken=${ART_TOKEN}"
        } > ~/.npmrc

        # 4. Same for yarn, which ignores .npmrc from v2 onward and needs its
        #    own config. Written to the home directory, not the project: a
        #    project .yarnrc.yml is usually checked in (nodeLinker etc.) and
        #    overwriting it would change how the project installs.
        {
          echo "npmRegistryServer: \"${REGISTRY}\""
          echo "npmAlwaysAuth: true"
          echo "npmAuthToken: \"${ART_TOKEN}\""
        } > ~/.yarnrc.yml
        echo "::notice::npm and yarn configured to use Artifactory registry"
