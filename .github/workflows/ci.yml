name: CI
on:
  push:
    # TODO:
    # TEMPORARY! remove task/build-appium-harness before merging this to main!
    branches: [main, task/build-appium-harness]
  pull_request:
# No default permissions; each job below declares exactly what it needs.
permissions: {}

jobs:
  # Fork PRs don't run CI at all - they can't get Artifactory access, and
  # this repo doesn't run tests without it. A maintainer reviews and tests
  # fork PRs manually before merging. Revisit if we want fork PRs to run CI
  # safely.
  test:
    # Allowlists event names - add any new trigger here too, such as 'schedule'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-x64
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # for the Artifactory OIDC exchange below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      # Enable Corepack so `yarn` resolves to the version pinned in package.json's
      # "packageManager" field (Yarn 4) instead of the runner's global Yarn 1.
      # Must run before setup-node, whose `cache: yarn` step invokes yarn.
      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "22.13"
          cache: yarn

      - run: yarn install --immutable

      - run: yarn --cwd test/app install --immutable

      - run: yarn --cwd test/expo install --immutable

      - run: yarn --cwd test/appium-harness install --immutable

      - run: yarn --cwd test/appium-orchestrator install --immutable

      # `yarn run check` includes check:linking, which guards the property that
      # 2.x lost: the package autolinks in a bare React Native app. It needs no
      # Android SDK, so it runs in this job rather than on a device runner.
      - run: yarn run check

      # The runner group is self-hosted, so $HOME can outlive the job.
      - name: Remove Artifactory credentials
        if: always()
        run: rm -f ~/.npmrc ~/.yarnrc.yml

  ###
  # Build Android artifacts
  ###
  build-android:
    # Allowlists event names - add any new trigger here too, such as 'schedule'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-x64
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # for the Artifactory OIDC exchange below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      # Enable Corepack so `yarn` resolves to the version pinned in package.json's
      # "packageManager" field (Yarn 4) instead of the runner's global Yarn 1.
      # Must run before setup-node, whose `cache: yarn` step invokes yarn.
      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "22.13"
          cache: yarn

      # JDK 17 matches what CircleCI's e2e-android job selects via the Android orb,
      # and is what RN 0.83 / AGP 8.x expect.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # 5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # Runs before the installs, which take ~10 minutes: a runner group without an
      # Android SDK should fail in seconds rather than at the very end. We do not
      # provision the SDK here - if this step ever fails, the fix is to add a
      # cmdline-tools + sdkmanager + license-acceptance step, not to weaken this check.
      - name: Verify the runner has an Android SDK
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "::error::No Android SDK on this runner (ANDROID_HOME and ANDROID_SDK_ROOT are unset or point at a missing directory). This workflow assumes the ubuntu-x64 runner group provides one; if it does not, an SDK provisioning step must be added."
            exit 1
          fi

          for tool_dir in platforms build-tools; do
            if [ ! -d "${SDK_DIR}/${tool_dir}" ]; then
              echo "::error::Android SDK at ${SDK_DIR} is missing ${tool_dir}/. The SDK install on this runner is incomplete."
              exit 1
            fi
          done

          # Export under the canonical name so Gradle picks it up even if only
          # ANDROID_SDK_ROOT was set. `expo prebuild` writes local.properties itself.
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "::notice::Using Android SDK at ${SDK_DIR}"

      - run: yarn install --immutable

      # Load-bearing, and easy to miss. `prepare` runs build:constants, which writes
      # android/src/main/java/com/twiliovoicereactnative/CommonConstants.java - a
      # gitignored file the SDK's Java sources import, so the Android compile fails
      # on a fresh checkout without it. The harness depends on the SDK via
      # `portal:../../`, and Yarn does not run a portal target's lifecycle scripts,
      # so nothing else triggers this. CircleCI's install-dependencies does the same.
      - run: yarn run prepare

      - run: |
          cd test/appium-harness
          yarn install --immutable

      # app.config.mjs statically imports ./secrets.json, so it cannot even be
      # loaded without this file. These are placeholder values, not real credentials:
      # this workflow deliberately adds no repository secrets or variables. The
      # ios.* fields are read at config-load time even for an Android-only prebuild.
      - name: Write placeholder secrets.json
        working-directory: test/appium-harness
        run: |
          set -euo pipefail

          cat > secrets.json <<EOF
          {
            "ios": {
              "appleTeamId": "PLACEHOLDER",
              "bundleIdentifier": "com.example.twilioreactnativeappiumharness"
            },
            "android": {
              "package": "com.example.twilioreactnativeappiumharness"
            }
          }
          EOF

      # app.config.mjs references `./google-services.json`, so Expo cannot prebuild
      # without this file. These are placeholder values, not real credentials:
      # this workflow deliberately adds no repository secrets or variables.
      - name: Write placeholder google-services.json
        working-directory: test/appium-harness
        run: |
          set -euo pipefail

          cat > google-services.json <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.twilioreactnativeappiumharness"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # Generates the gitignored android/ project: gradlew, the wrapper, the debug
      # keystore, local.properties, and the release signing config (which points at
      # the debug keystore - that is why no signing secret is needed).
      - name: Expo prebuild (android)
        run: |
          cd test/appium-harness
          yarn run prebuild --clean --platform=android

      # assembleRelease, not assembleDebug: a release build bundles the JS into the
      # APK, so the artifact runs standalone with no Metro server. That is the whole
      # point of publishing it.
      - name: Assemble release APK
        working-directory: test/appium-harness/android
        # RN 0.83 new-arch codegen is memory-hungry, and the Expo app template's
        # default heap is lower than what the SDK's own gradle.properties asks for.
        # The heap is raised with -Dorg.gradle.jvmargs instead of GRADLE_OPTS.
        # GRADLE_OPTS only sizes the launcher JVM, and the build itself runs in a
        # separate JVM sized by org.gradle.jvmargs.
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload appium harness android apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: appium-harness-android-apk
          path: test/appium-harness/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # The runner group is self-hosted, so $HOME and the workspace can outlive the
      # job. secrets.json holds only placeholders today, but clearing it keeps a
      # future run from silently inheriting a stale one.
      - name: Remove Artifactory credentials and generated secrets
        if: always()
        run: |
          rm -f \
            ~/.npmrc \
            ~/.yarnrc.yml \
            test/appium-harness/secrets.json \
            test/appium-harness/google-services.json \
            test/appium-harness/android/app/google-services.json

  ###
  # Build iOS artifacts
  ###
  build-ios:
    # Allowlists event names - add any new trigger here too, such as 'schedule'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork)
    runs-on: macos-arm
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # for the Artifactory OIDC exchange below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      # Runs before everything else, and before the installs that take ~10 minutes:
      # a runner group without an iOS toolchain should fail in seconds rather than
      # at the very end. We do not provision anything here - if this step ever
      # fails, the fix is to fix the runner image, not to weaken the check.
      - name: Verify the runner has an iOS toolchain
        run: |
          set -euo pipefail

          if ! command -v xcodebuild >/dev/null 2>&1; then
            echo "::error::xcodebuild not found. This workflow assumes the macos-arm runner group provides Xcode; if it does not, an Xcode provisioning step must be added."
            exit 1
          fi

          if ! command -v pod >/dev/null 2>&1; then
            echo "::error::CocoaPods (pod) not found. \`expo prebuild\` installs the harness pods and cannot do so without it."
            exit 1
          fi

          # The artifactory-oidc action below parses its token exchange with jq and
          # hard-fails without it. Present on GitHub-hosted macOS images, but not
          # guaranteed on a self-hosted one.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not found. The artifactory-oidc action requires it."
            exit 1
          fi

          # We deliberately do not pin an Xcode version, so log the one in use -
          # it is the first thing to check when a build starts failing for no
          # apparent reason.
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      # Enable Corepack so `yarn` resolves to the version pinned in package.json's
      # "packageManager" field (Yarn 4) instead of the runner's global Yarn 1.
      # Must run before setup-node, whose `cache: yarn` step invokes yarn.
      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "22.13"
          cache: yarn

      - run: yarn install --immutable

      # Load-bearing, and easy to miss. `prepare` runs build:constants, which writes
      # ios/TwilioVoiceReactNativeConstants.h - a gitignored file matched by the
      # podspec's ios/**/*.{h,m,mm} glob and imported by the SDK's Objective-C
      # sources, so the Xcode build fails on a fresh checkout without it. It also
      # runs `bob build` to produce lib/, which the harness bundles. The harness
      # depends on the SDK via `portal:../../`, and Yarn does not run a portal
      # target's lifecycle scripts, so nothing else triggers this. CircleCI's
      # install-dependencies does the same.
      - run: yarn run prepare

      - run: |
          cd test/appium-harness
          yarn install --immutable

      # app.config.mjs statically imports ./secrets.json, so it cannot even be
      # loaded without this file. These are placeholder values, not real credentials:
      # this workflow deliberately adds no repository secrets or variables.
      #
      # appleTeamId is irrelevant here - every CODE_SIGN* setting is disabled in the
      # xcodebuild step below - but the config reads it unconditionally.
      - name: Write placeholder secrets
        working-directory: test/appium-harness
        run: |
          set -euo pipefail

          cat > secrets.json <<EOF
          {
            "ios": {
              "appleTeamId": "PLACEHOLDER",
              "bundleIdentifier": "com.example.twilioreactnativeappiumharness"
            },
            "android": {
              "package": "com.example.twilioreactnativeappiumharness"
            }
          }
          EOF

      # Fake google-services.json file. Does not need to be as elaborate as the
      # Android build pipeline.
      - name: Write placeholder google-services.json
        working-directory: test/appium-harness
        run: |
          set -euo pipefail

          cat > google-services.json <<EOF
          {}
          EOF

      # Generates the gitignored ios/ project: the Xcode project, the workspace, the
      # Podfile, and the entitlements file. This also runs `pod install` - `expo
      # prebuild` installs CocoaPods unless --no-install is passed, so there is no
      # separate pod step.
      - name: Expo prebuild (ios)
        run: |
          cd test/appium-harness
          yarn run prebuild --clean --platform=ios

      # -configuration Release, not Debug: a release build bundles the JS into the
      # app, so the artifact runs standalone with no Metro server. That is the whole
      # point of publishing it.
      #
      # The CODE_SIGN* overrides are what make this work with no certificate on the
      # runner. app.config.mjs declares aps-environment entitlements, which would
      # otherwise demand a matching provisioning profile - CODE_SIGN_ENTITLEMENTS=""
      # is what drops them. Keep all four of the CODE_SIGN* overrides in sync.
      - name: Build unsigned release app
        working-directory: test/appium-harness/ios
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace "twiliovoicereactnativesdkappiumharness.xcworkspace" \
            -scheme "twiliovoicereactnativesdkappiumharness" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # `xcodebuild build` emits a .app, not a .ipa. The usual -archivePath +
      # -exportArchive route needs an export options plist and a signing identity,
      # so for an unsigned artifact we build the IPA layout by hand: an .ipa is
      # just a zip with the .app under Payload/.
      #
      # -y preserves the symlinks inside the embedded frameworks; without it the zip
      # inflates and the framework layout is subtly wrong.
      - name: Package unsigned ipa
        working-directory: test/appium-harness/ios
        run: |
          set -euo pipefail

          PRODUCTS_DIR=build/Build/Products/Release-iphoneos
          APP_PATH="${PRODUCTS_DIR}/twiliovoicereactnativesdkappiumharness.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::xcodebuild reported success but ${APP_PATH} does not exist. Products dir contains: $(ls -1 "$PRODUCTS_DIR" 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

          # Sanity check the whole reason for using a Release configuration.
          if [ ! -f "${APP_PATH}/main.jsbundle" ]; then
            echo "::error::${APP_PATH} has no main.jsbundle - the JS was not embedded, so this app would need a Metro server to run."
            exit 1
          fi

          rm -rf ../ipa
          mkdir -p ../ipa/Payload
          cp -R "$APP_PATH" ../ipa/Payload/

          cd ../ipa
          zip -qry "twiliovoicereactnativesdkappiumharness.ipa" Payload
          rm -rf Payload

      - name: Upload appium harness ios ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: appium-harness-ios-ipa
          path: test/appium-harness/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      # The runner group is self-hosted, so $HOME and the workspace can outlive the
      # job. secrets.json holds only placeholders today, but clearing it keeps a
      # future run from silently inheriting a stale one.
      - name: Remove Artifactory credentials and generated secrets
        if: always()
        run: |
          rm -f \
            ~/.npmrc \
            ~/.yarnrc.yml \
            test/appium-harness/secrets.json \
            test/appium-harness/google-services.json \
            test/appium-harness/android/app/google-services.json

  ###
  # Upload the Android harness build to SauceLabs
  ###
  upload-android-saucelabs:
    # Allowlists event names - add any new trigger here too, such as 'schedule'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork)
    needs: build-android
    runs-on: ubuntu-x64
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for the credential vendor OIDC exchange below
    outputs:
      filename: ${{ steps.upload.outputs.filename }}
      file_id: ${{ steps.upload.outputs.file_id }}
    # This job deliberately runs no actions/checkout. The job reads no file from
    # the repository, so a checkout would only widen what the job can touch.
    steps:
      - name: Verify the runner has the tools this job needs
        run: |
          set -euo pipefail

          for tool in curl jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::${tool} not found. This job makes its requests with curl and parses both the vendor response and the SauceLabs response with jq."
              exit 1
            fi
          done

      - name: Download the android apk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: appium-harness-android-apk
          path: artifact

      # An empty or unexpected download should fail here with a message naming what
      # was actually found, rather than further down inside a curl invocation whose
      # error describes a missing file path and nothing else.
      - name: Verify the apk was downloaded
        run: |
          set -euo pipefail

          # build-android uploads a single file, so the artifact carries that
          # file's basename. Renaming the APK in build-android fails here rather
          # than silently uploading whatever else landed in artifact/.
          APK_PATH=artifact/app-release.apk

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected ${APK_PATH} from the appium-harness-android-apk artifact. Directory contains: $(ls -1 artifact 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

          echo "APK_PATH=${APK_PATH}" >> "$GITHUB_ENV"

      # The credential fetch and the upload share one step on purpose. The SauceLabs
      # username and access key stay as shell locals and are never written to
      # $GITHUB_ENV. The runner group is self-hosted, so $HOME and the workspace can
      # outlive the job, and a value that is never written out has no cleanup step
      # to forget.
      - name: Fetch SauceLabs credentials and upload the apk
        id: upload
        env:
          VENDOR_URL: ${{ secrets.E2E_CREDENTIAL_VENDOR_URL }}
          VENDOR_AUDIENCE: ${{ vars.E2E_CREDENTIAL_VENDOR_AUDIENCE }}
          SAUCE_UPLOAD_URL: ${{ vars.SAUCE_UPLOAD_URL }}
        run: |
          set -euo pipefail

          if [ -z "$VENDOR_URL" ]; then
            echo "::error::The E2E_CREDENTIAL_VENDOR_URL repository secret is not set."
            exit 1
          fi

          if [ -z "$VENDOR_AUDIENCE" ]; then
            echo "::error::The E2E_CREDENTIAL_VENDOR_AUDIENCE repository variable is not set."
            exit 1
          fi

          # Checked here rather than at the upload below, so an unset value fails
          # before the credential exchange rather than after, and fails with a
          # message that names the setting instead of curl's "no URL specified".
          if [ -z "$SAUCE_UPLOAD_URL" ]; then
            echo "::error::The SAUCE_UPLOAD_URL repository variable is not set."
            exit 1
          fi

          # 1. Request a GitHub OIDC JWT for the vendor's audience. -G puts the
          #    --data-urlencode into the query string rather than a POST body.
          #    Encoding the audience instead of splicing the audience into the URL
          #    keeps the request well-formed whatever the value contains.
          GITHUB_JWT=$(curl -sS -G \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${VENDOR_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
            | jq -r '.value')
          if [ -z "$GITHUB_JWT" ] || [ "$GITHUB_JWT" = 'null' ]; then
            echo "::error::Failed to obtain a GitHub OIDC JWT"
            exit 1
          fi
          echo "::add-mask::$GITHUB_JWT"

          # 2. Exchange the JWT for this platform's SauceLabs service account.
          VENDOR_RESP=$(curl -sS "$VENDOR_URL" \
            -H "Authorization: Bearer ${GITHUB_JWT}" \
            -H 'Content-Type: application/json' \
            -d '{"action":"get-saucelabs-credentials","platform":"android"}')

          # Each value is masked the moment the value is parsed, before the failure
          # branch below can print anything. A partial response that carries only
          # the username must not reach the log unmasked.
          SAUCE_USERNAME=$(echo "$VENDOR_RESP" | jq -r '.username // empty' 2>/dev/null || true)
          if [ -n "$SAUCE_USERNAME" ]; then
            echo "::add-mask::$SAUCE_USERNAME"
          fi

          SAUCE_ACCESS_KEY=$(echo "$VENDOR_RESP" | jq -r '.accessKey // empty' 2>/dev/null || true)
          if [ -n "$SAUCE_ACCESS_KEY" ]; then
            echo "::add-mask::$SAUCE_ACCESS_KEY"
          fi

          if [ -z "$SAUCE_USERNAME" ] || [ -z "$SAUCE_ACCESS_KEY" ]; then
            echo "::error::The credential vendor returned no SauceLabs credentials. Redacted response below:"
            # Redact every key whose name contains "token" or "key". Withhold the
            # body entirely when the body is not valid JSON, rather than printing a
            # raw unredacted body.
            echo "$VENDOR_RESP" | jq 'walk(if type == "object" then with_entries(if (.key | test("token|key"; "i")) then .value = "<redacted>" else . end) else . end)' 2>/dev/null \
              || echo "::error::(response withheld - not valid JSON)"
            exit 1
          fi

          # 3. Upload. The filename is tagged with the commit SHA, so every build
          #    lands in its own SauceLabs app group and a given run's build is
          #    addressable without ambiguity.
          FILENAME="twilio-voice-react-native-appium-harness-${GITHUB_SHA}.apk"

          # --write-out appends the status code on its own trailing line. -f is
          # deliberately not used, because -f discards the response body on an
          # error, and the body is the only description of what went wrong.
          UPLOAD_RESP=$(curl -sS \
            -u "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" \
            -F "payload=@${APK_PATH}" \
            -F "name=${FILENAME}" \
            --write-out '\n%{http_code}' \
            "$SAUCE_UPLOAD_URL")

          HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -n 1)
          BODY=$(echo "$UPLOAD_RESP" | sed '$d')

          if [ "${HTTP_CODE:0:1}" != "2" ]; then
            echo "::error::SauceLabs upload failed with HTTP ${HTTP_CODE}. Response body below:"
            echo "$BODY"
            exit 1
          fi

          FILE_ID=$(echo "$BODY" | jq -r '.item.id // empty' 2>/dev/null || true)
          if [ -z "$FILE_ID" ]; then
            echo "::error::SauceLabs answered ${HTTP_CODE} but the response carried no .item.id. Response body below:"
            echo "$BODY"
            exit 1
          fi

          # Neither value is a secret. The filename derives from the commit SHA and
          # the file id is an opaque storage handle.
          {
            echo "filename=${FILENAME}"
            echo "file_id=${FILE_ID}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### SauceLabs upload (android)"
            echo ""
            echo "- filename: \`${FILENAME}\`"
            echo "- file id: \`${FILE_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner group is self-hosted, so the workspace can outlive the job, and
      # this job runs no checkout to clear the workspace on a later run.
      - name: Remove the downloaded artifact
        if: always()
        run: rm -rf artifact

  ###
  # Upload the iOS harness build to SauceLabs
  ###
  upload-ios-saucelabs:
    # Allowlists event names - add any new trigger here too, such as 'schedule'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork)
    needs: build-ios
    # ubuntu-x64, not macos-arm. This job posts a file that build-ios already
    # produced, so this job needs no macOS toolchain and should not occupy a
    # macOS runner.
    runs-on: ubuntu-x64
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for the credential vendor OIDC exchange below
    outputs:
      filename: ${{ steps.upload.outputs.filename }}
      file_id: ${{ steps.upload.outputs.file_id }}
    # This job deliberately runs no actions/checkout. The job reads no file from
    # the repository, so a checkout would only widen what the job can touch.
    steps:
      - name: Verify the runner has the tools this job needs
        run: |
          set -euo pipefail

          for tool in curl jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::${tool} not found. This job makes its requests with curl and parses both the vendor response and the SauceLabs response with jq."
              exit 1
            fi
          done

      - name: Download the ios ipa
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: appium-harness-ios-ipa
          path: artifact

      # An empty or unexpected download should fail here with a message naming what
      # was actually found, rather than further down inside a curl invocation whose
      # error describes a missing file path and nothing else.
      - name: Verify the ipa was downloaded
        run: |
          set -euo pipefail

          # build-ios zips this exact name, and the scheme name is already
          # hardcoded throughout build-ios. Renaming the scheme fails here rather
          # than silently uploading whatever else landed in artifact/.
          IPA_PATH=artifact/twiliovoicereactnativesdkappiumharness.ipa

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::Expected ${IPA_PATH} from the appium-harness-ios-ipa artifact. Directory contains: $(ls -1 artifact 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

          echo "IPA_PATH=${IPA_PATH}" >> "$GITHUB_ENV"

      # The credential fetch and the upload share one step on purpose. The SauceLabs
      # username and access key stay as shell locals and are never written to
      # $GITHUB_ENV. The runner group is self-hosted, so $HOME and the workspace can
      # outlive the job, and a value that is never written out has no cleanup step
      # to forget.
      - name: Fetch SauceLabs credentials and upload the ipa
        id: upload
        env:
          VENDOR_URL: ${{ secrets.E2E_CREDENTIAL_VENDOR_URL }}
          VENDOR_AUDIENCE: ${{ vars.E2E_CREDENTIAL_VENDOR_AUDIENCE }}
          SAUCE_UPLOAD_URL: ${{ vars.SAUCE_UPLOAD_URL }}
        run: |
          set -euo pipefail

          if [ -z "$VENDOR_URL" ]; then
            echo "::error::The E2E_CREDENTIAL_VENDOR_URL repository secret is not set."
            exit 1
          fi

          if [ -z "$VENDOR_AUDIENCE" ]; then
            echo "::error::The E2E_CREDENTIAL_VENDOR_AUDIENCE repository variable is not set."
            exit 1
          fi

          # Checked here rather than at the upload below, so an unset value fails
          # before the credential exchange rather than after, and fails with a
          # message that names the setting instead of curl's "no URL specified".
          if [ -z "$SAUCE_UPLOAD_URL" ]; then
            echo "::error::The SAUCE_UPLOAD_URL repository variable is not set."
            exit 1
          fi

          # 1. Request a GitHub OIDC JWT for the vendor's audience. -G puts the
          #    --data-urlencode into the query string rather than a POST body.
          #    Encoding the audience instead of splicing the audience into the URL
          #    keeps the request well-formed whatever the value contains.
          GITHUB_JWT=$(curl -sS -G \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${VENDOR_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
            | jq -r '.value')
          if [ -z "$GITHUB_JWT" ] || [ "$GITHUB_JWT" = 'null' ]; then
            echo "::error::Failed to obtain a GitHub OIDC JWT"
            exit 1
          fi
          echo "::add-mask::$GITHUB_JWT"

          # 2. Exchange the JWT for this platform's SauceLabs service account.
          VENDOR_RESP=$(curl -sS "$VENDOR_URL" \
            -H "Authorization: Bearer ${GITHUB_JWT}" \
            -H 'Content-Type: application/json' \
            -d '{"action":"get-saucelabs-credentials","platform":"ios"}')

          # Each value is masked the moment the value is parsed, before the failure
          # branch below can print anything. A partial response that carries only
          # the username must not reach the log unmasked.
          SAUCE_USERNAME=$(echo "$VENDOR_RESP" | jq -r '.username // empty' 2>/dev/null || true)
          if [ -n "$SAUCE_USERNAME" ]; then
            echo "::add-mask::$SAUCE_USERNAME"
          fi

          SAUCE_ACCESS_KEY=$(echo "$VENDOR_RESP" | jq -r '.accessKey // empty' 2>/dev/null || true)
          if [ -n "$SAUCE_ACCESS_KEY" ]; then
            echo "::add-mask::$SAUCE_ACCESS_KEY"
          fi

          if [ -z "$SAUCE_USERNAME" ] || [ -z "$SAUCE_ACCESS_KEY" ]; then
            echo "::error::The credential vendor returned no SauceLabs credentials. Redacted response below:"
            # Redact every key whose name contains "token" or "key". Withhold the
            # body entirely when the body is not valid JSON, rather than printing a
            # raw unredacted body.
            echo "$VENDOR_RESP" | jq 'walk(if type == "object" then with_entries(if (.key | test("token|key"; "i")) then .value = "<redacted>" else . end) else . end)' 2>/dev/null \
              || echo "::error::(response withheld - not valid JSON)"
            exit 1
          fi

          # 3. Upload. The filename is tagged with the commit SHA, so every build
          #    lands in its own SauceLabs app group and a given run's build is
          #    addressable without ambiguity.
          FILENAME="twilio-voice-react-native-appium-harness-${GITHUB_SHA}.ipa"

          # --write-out appends the status code on its own trailing line. -f is
          # deliberately not used, because -f discards the response body on an
          # error, and the body is the only description of what went wrong.
          UPLOAD_RESP=$(curl -sS \
            -u "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" \
            -F "payload=@${IPA_PATH}" \
            -F "name=${FILENAME}" \
            --write-out '\n%{http_code}' \
            "$SAUCE_UPLOAD_URL")

          HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -n 1)
          BODY=$(echo "$UPLOAD_RESP" | sed '$d')

          if [ "${HTTP_CODE:0:1}" != "2" ]; then
            echo "::error::SauceLabs upload failed with HTTP ${HTTP_CODE}. Response body below:"
            echo "$BODY"
            exit 1
          fi

          FILE_ID=$(echo "$BODY" | jq -r '.item.id // empty' 2>/dev/null || true)
          if [ -z "$FILE_ID" ]; then
            echo "::error::SauceLabs answered ${HTTP_CODE} but the response carried no .item.id. Response body below:"
            echo "$BODY"
            exit 1
          fi

          # Neither value is a secret. The filename derives from the commit SHA and
          # the file id is an opaque storage handle.
          {
            echo "filename=${FILENAME}"
            echo "file_id=${FILE_ID}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### SauceLabs upload (ios)"
            echo ""
            echo "- filename: \`${FILENAME}\`"
            echo "- file id: \`${FILE_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner group is self-hosted, so the workspace can outlive the job, and
      # this job runs no checkout to clear the workspace on a later run.
      - name: Remove the downloaded artifact
        if: always()
        run: rm -rf artifact

  ###
  # Run the appium orchestrator against the uploaded iOS harness build
  ###
  e2e-ios-saucelabs:
    # Allowlists event names - add any new trigger here too, such as 'schedule'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork)
    needs: upload-ios-saucelabs
    runs-on: ubuntu-x64
    # Thirty rather than the upload jobs' fifteen. A real device cloud run pays
    # device allocation and app installation before the orchestrator's own 120
    # second suite wait begins.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # for the credential vendor OIDC exchange below
    # Unlike the upload jobs, this job does check out. The orchestrator is code
    # in this repository and this job runs the orchestrator.
    steps:
      - uses: actions/checkout@<TODO>

      - name: Verify the runner has the tools this job needs
        run: |
          set -euo pipefail

          for tool in curl jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::${tool} not found. This job makes its requests with curl and builds both orchestrator config files with jq."
              exit 1
            fi
          done

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      - run: corepack enable

      - uses: actions/setup-node@<TODO>
        with:
          node-version: "22.13"
          cache: yarn

      - run: yarn --cwd test/appium-orchestrator install --immutable

      # The credential fetch and the config write share one step on purpose. The
      # SauceLabs service account and the access token stay as shell locals and
      # are never written to $GITHUB_ENV. The runner group is self-hosted, so a
      # value that is never written out has no cleanup step to forget.
      - name: Fetch credentials and write the orchestrator config
        env:
          VENDOR_URL: ${{ secrets.E2E_CREDENTIAL_VENDOR_URL }}
          VENDOR_AUDIENCE: ${{ vars.E2E_CREDENTIAL_VENDOR_AUDIENCE }}
          SAUCE_HOSTNAME: ${{ vars.SAUCE_HOSTNAME }}
          SAUCE_PORT: ${{ vars.SAUCE_PORT }}
          SAUCE_BASE_URL: ${{ vars.SAUCE_BASE_URL }}
          STORAGE_FILENAME: ${{ needs.upload-ios-saucelabs.outputs.filename }}
        run: |
          set -euo pipefail

          # Both config files carry credentials, so they are created readable by
          # this user only.
          umask 077

          for required in VENDOR_URL VENDOR_AUDIENCE SAUCE_HOSTNAME SAUCE_PORT SAUCE_BASE_URL STORAGE_FILENAME; do
            if [ -z "${!required}" ]; then
              echo "::error::${required} is not set."
              exit 1
            fi
          done

          # Redact every key whose name contains "token" or "key". Withhold the
          # body entirely when the body is not valid JSON, rather than printing
          # a raw unredacted body.
          redact_response() {
            echo "$1" | jq 'walk(if type == "object" then with_entries(if (.key | test("token|key"; "i")) then .value = "<redacted>" else . end) else . end)' 2>/dev/null \
              || echo "::error::(response withheld - not valid JSON)"
          }

          # 1. Request a GitHub OIDC JWT for the vendor's audience. -G puts the
          #    --data-urlencode into the query string rather than a POST body.
          #    Encoding the audience instead of splicing the audience into the
          #    URL keeps the request well-formed whatever the value contains.
          GITHUB_JWT=$(curl -sS -G \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${VENDOR_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
            | jq -r '.value')
          if [ -z "$GITHUB_JWT" ] || [ "$GITHUB_JWT" = 'null' ]; then
            echo "::error::Failed to obtain a GitHub OIDC JWT"
            exit 1
          fi
          echo "::add-mask::$GITHUB_JWT"

          # 2. Exchange the JWT for this platform's SauceLabs service account.
          #    Each value is masked the moment the value is parsed, before the
          #    failure branch below can print anything.
          SAUCE_RESP=$(curl -sS "$VENDOR_URL" \
            -H "Authorization: Bearer ${GITHUB_JWT}" \
            -H 'Content-Type: application/json' \
            -d '{"action":"get-saucelabs-credentials","platform":"ios"}')

          SAUCE_USERNAME=$(echo "$SAUCE_RESP" | jq -r '.username // empty' 2>/dev/null || true)
          if [ -n "$SAUCE_USERNAME" ]; then
            echo "::add-mask::$SAUCE_USERNAME"
          fi

          SAUCE_ACCESS_KEY=$(echo "$SAUCE_RESP" | jq -r '.accessKey // empty' 2>/dev/null || true)
          if [ -n "$SAUCE_ACCESS_KEY" ]; then
            echo "::add-mask::$SAUCE_ACCESS_KEY"
          fi

          if [ -z "$SAUCE_USERNAME" ] || [ -z "$SAUCE_ACCESS_KEY" ]; then
            echo "::error::The credential vendor returned no SauceLabs credentials. Redacted response below:"
            redact_response "$SAUCE_RESP"
            exit 1
          fi

          # 3. Mint the access token the harness dials with. The ttl is the
          #    vendor's 3600 second ceiling rather than the vendor's 300 second
          #    default, which would very plausibly expire during device
          #    allocation, before the harness ever dials. A ttl above the
          #    ceiling is capped rather than rejected.
          TOKEN_REQ=$(jq -nc --arg identity "ci-ios-${GITHUB_SHA}-$(date +%s%3N)" \
            '{action: "mint-voice-token", identity: $identity, ttl: 3600}')

          TOKEN_RESP=$(curl -sS "$VENDOR_URL" \
            -H "Authorization: Bearer ${GITHUB_JWT}" \
            -H 'Content-Type: application/json' \
            -d "$TOKEN_REQ")

          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.token // empty' 2>/dev/null || true)
          if [ -n "$ACCESS_TOKEN" ]; then
            echo "::add-mask::$ACCESS_TOKEN"
          fi

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::The credential vendor minted no access token. Redacted response below:"
            redact_response "$TOKEN_RESP"
            exit 1
          fi

          # 4. Write the two gitignored config files the orchestrator imports.
          #    Both files are built with jq --arg rather than by splicing values
          #    into a JSON literal. A credential containing a quote or a
          #    backslash would otherwise break the file or inject sibling
          #    fields. The port is --argjson, so a non-numeric port fails here
          #    rather than inside WebdriverIO.
          jq -n --arg accessToken "$ACCESS_TOKEN" \
            '{accessToken: $accessToken}' \
            > test/appium-orchestrator/token.json

          jq -n \
            --arg user "$SAUCE_USERNAME" \
            --arg key "$SAUCE_ACCESS_KEY" \
            --arg hostname "$SAUCE_HOSTNAME" \
            --argjson port "$SAUCE_PORT" \
            --arg baseUrl "$SAUCE_BASE_URL" \
            --arg storageFilename "storage:filename=${STORAGE_FILENAME}" \
            '{sauce: {user: $user, key: $key, hostname: $hostname, port: $port, baseUrl: $baseUrl, storageFilename: $storageFilename}}' \
            > test/appium-orchestrator/secrets.json

      # The orchestrator already sets a non-zero exit code on failure and
      # already stamps sauce:job-result, so this step needs no result parsing.
      - name: Run the orchestrator
        working-directory: test/appium-orchestrator
        env:
          USE_SAUCE: "true"
          PLATFORM: ios
        run: node test-suites/index.mjs

      - name: Report which build was exercised
        if: always()
        env:
          STORAGE_FILENAME: ${{ needs.upload-ios-saucelabs.outputs.filename }}
        run: |
          set -euo pipefail

          {
            echo "### SauceLabs e2e (ios)"
            echo ""
            echo "- app: \`${STORAGE_FILENAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner group is self-hosted, so the workspace and $HOME can outlive
      # the job.
      - name: Remove the generated credentials
        if: always()
        run: |
          rm -f test/appium-orchestrator/secrets.json \
                test/appium-orchestrator/token.json \
                ~/.npmrc \
                ~/.yarnrc.yml

