name: CI
on:
  push:
    branches: [main, temp/ci-workflow-aug-2026]
  pull_request:
# No default permissions; each job below declares exactly what it needs.
permissions: {}

jobs:
  # Fork PRs don't run CI at all - they can't get Artifactory access, and
  # this repo doesn't run tests without it. A maintainer reviews and tests
  # fork PRs manually before merging. Revisit if we want fork PRs to run CI
  # safely.
  test:
    # Allowlists event names - add any new trigger here too, such as 'schedule'
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-x64
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # for the Artifactory OIDC exchange below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      # Enable Corepack so `yarn` resolves to the version pinned in package.json's
      # "packageManager" field (Yarn 4) instead of the runner's global Yarn 1.
      # Must run before setup-node, whose `cache: yarn` step invokes yarn.
      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "22.13"
          cache: yarn

      # TEMPORARY - diagnosing 403s on axios tarballs. Remove once resolved.
      # Never fails the job: this is here to produce evidence, not to gate CI.
      - name: Debug Artifactory 403
        continue-on-error: true
        run: |
          set -x
          REG="${YARN_NPM_REGISTRY_SERVER%/}"

          # Which identity does Artifactory see for the token yarn is using?
          yarn npm whoami || true

          # What tarball URL does Artifactory advertise? Yarn ignores this and
          # synthesizes its own; a mismatch here is itself the answer.
          yarn npm info axios@1.6.7 --fields dist --json || true

          # The 403 body - yarn never prints it, and it carries the reason.
          for V in 1.6.7 1.7.2; do
            URL="${REG}/axios/-/axios-${V}.tgz"
            echo "--- authenticated: $URL"
            curl -s -D /dev/stdout -o /tmp/body.$V \
              -H "Authorization: Bearer ${YARN_NPM_AUTH_TOKEN}" "$URL"
            file /tmp/body.$V   # a gzip here means it actually downloaded
            head -c 2000 /tmp/body.$V | tr -d '\0'
            echo
            echo "--- anonymous: $URL"
            curl -s -o /dev/null -w 'status=%{http_code}\n' "$URL"
          done

          # Apples-to-apples with npm: the exact version yarn.lock pins,
          # using npm's own config from ~/.npmrc rather than a forced flag.
          npm config get registry
          npm pack axios@1.6.7 || true

      - run: yarn install --immutable

      - run: yarn --cwd test/app install --immutable

      - run: yarn --cwd test/expo install --immutable

      - run: yarn --cwd test/appium-harness install --immutable

      - run: yarn --cwd test/appium-orchestrator install --immutable

      - run: yarn run check

      # The runner group is self-hosted, so $HOME can outlive the job.
      - name: Remove Artifactory credentials
        if: always()
        run: rm -f ~/.npmrc ~/.yarnrc.yml
